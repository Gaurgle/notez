# Relay placeholder values, read by ~/claude-config/scripts/relay-upgrade.
# DEVIATIONS is the stamp's local-deviations text.
BOARD = "`https://github.com/users/Gaurgle/projects/2`"
BOARD_NUMBER = "2"
BOARD_OWNER = "Gaurgle"
BOARD_READ = "read it with the GraphQL command in docs/agent-workflow.md"
CHECKS = "gh api graphql -f query='query { node(id: \"PVT_kwHOCU842c4BmE5Z\") { ... on ProjectV2 { items(first: 100) { nodes { id content { ... on Issue { number title } } fieldValueByName(name: \"Status\") { ... on ProjectV2ItemFieldSingleSelectValue { name } } } } } } }'"
INTEGRATION_BRANCH = "main"
INTEGRATION_POLICY = "Owner integrates; the lead presents commands and stops at Ready to integrate. Relay setup grants no commit, push or merge permission. The repo ships direct to `main` with no PR. CI (`.github/workflows/ci.yml`) builds and tests on ubuntu and macos on every push and pull request except docs-only changes, so a push to `main` triggers a run, but nothing here is delegated until the owner records it in `docs/agent-handoff.md`."
LEAD_MODEL = "fable"
OWNER = "Andreas"
OWNER_ONLY = "run `./install.sh` or install a binary"
PREFIX = "nz"
PROJECT = "notez"
SMALL_MODEL = "sonnet"
SWEEP = "scripts/relay-sweep main"
TICKET_PREFIX = "NZ"
TRY_BUILD_BRANCH = "`cargo run --release --manifest-path <worktree>/Cargo.toml -p notez-cli -- tree`"
TRY_BUILD_MAIN = "`./install.sh`, then `notez tree`"
WORKER_MODEL = "opus"
DEVIATIONS = "GitHub Project board read via GraphQL, three workers, docs-only CI rule, install.sh owner-only"
